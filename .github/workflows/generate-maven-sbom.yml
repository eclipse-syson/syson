name: Generate Maven SBOM

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        default: "main"
        required: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRO: "temurin"
  PRODUCT_PATH: "backend/application"
  PLUGIN_VERSION: "2.7.8"
  SBOM_TYPE: "makeAggregateBom"
  GITHUB_REF: ${{ github.ref }}
  INPUTS_VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate SBOM for backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.INPUTS_VERSION }}
          persist-credentials: false

      - name: Setup Java SDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}

      - name: Generate sbom
        env:
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn org.cyclonedx:cyclonedx-maven-plugin:$PLUGIN_VERSION:$SBOM_TYPE -f "$PRODUCT_PATH/pom.xml" --settings settings.xml

      - name: Extract product version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.metadata.component.version' < ./${{ env.PRODUCT_PATH }}/target/bom.json)"

          # Only a v* release tag yields a clean version, anything else is a
          # development snapshot. A called run builds GITHUB_REF, a manual run
          # builds the ref it was given.
          BUILT_REF="${INPUTS_VERSION:-$GITHUB_REF}"
          if [[ ! "$BUILT_REF" =~ ^(refs/tags/)?v ]]; then
            VERSION="${VERSION}@dev"
          fi

          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Product version: $VERSION"

      - name: Upload sbom
        uses: eclipse-csi/workflows/upload-sbom@0c1c6cf5cb4dc624a86410274c71b27d6273385a # main
        with:
          sbom-file: ${{ env.PRODUCT_PATH }}/target/bom.json
          product-name: "SysON - Backend"
          product-version: ${{ steps.version.outputs.PROJECT_VERSION }}
