name: Generate NPM Runtime SBOM

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        default: "main"
        required: true

env:
  NODE_VERSION: "24.20"
  REGISTRY_URL: "https://npm.pkg.github.com/"
  PRODUCT_PATH: "."
  GITHUB_REF: ${{ github.ref }}
  INPUTS_VERSION: ${{ inputs.version }}

permissions:
  contents: read

jobs:
  generate-sbom:
    name: Generate runtime SBOM for frontend (excluding dev tools)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.INPUTS_VERSION }}
          persist-credentials: false

      - name: Setup Node SDK
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install dependencies
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc
          echo "CI=true" >> $GITHUB_ENV
          npm ci

      - name: Install cyclonedx-npm
        run: |
          npm install --global @cyclonedx/cyclonedx-npm@5.0.0

      - name: Generate SBOM (runtime only)
        run: |
          cyclonedx-npm --output-format json --output-file bom.json --omit dev

      - name: Extract product version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.metadata.component.version' < ./${{ env.PRODUCT_PATH }}/bom.json)"

          # Only a v* release tag yields a clean version, anything else is a
          # development snapshot. A called run builds GITHUB_REF, a manual run
          # builds the ref it was given.
          BUILT_REF="${INPUTS_VERSION:-$GITHUB_REF}"
          if [[ ! "$BUILT_REF" =~ ^(refs/tags/)?v ]]; then
            VERSION="${VERSION}@dev"
          fi

          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Product version: $VERSION"

      - name: Upload SBOM
        uses: eclipse-csi/workflows/upload-sbom@0c1c6cf5cb4dc624a86410274c71b27d6273385a # main
        with:
          sbom-file: ${{ env.PRODUCT_PATH }}/bom.json
          product-name: "SysON - Frontend Runtime"
          product-version: ${{ steps.version.outputs.PROJECT_VERSION }}
